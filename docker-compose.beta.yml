services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.beta
    restart: always
    depends_on:
      - mongo
      - redis
    networks:
      - internal

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    restart: always
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - nextjs
    restart: always
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - internal

volumes:
  mongo_data:
  certbot_www:
  certbot_certs:

networks:
  internal:
