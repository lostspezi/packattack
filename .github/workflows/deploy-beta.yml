name: Deploy Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /opt/packattackgg-beta

            # Hard-sync the deployment checkout so force-pushes and rebases do not break beta deploys.
            git fetch origin beta
            git checkout -B beta origin/beta
            git reset --hard origin/beta
            git clean -fd
            BUILD_SHA=$(git rev-parse HEAD)
            BUILD_BRANCH=$(git rev-parse --abbrev-ref HEAD)

            # Generate .env.beta from secrets + hardcoded values
            cat > .env.beta << 'ENVEOF'
            MONGODB_URI=mongodb://mongo:27017/packattackgg
            REDIS_URL=redis://redis:6379
            NEXTAUTH_URL=https://beta.packattack.gg
            NEXT_PUBLIC_APP_URL=https://beta.packattack.gg
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
            DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}
            TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}
            TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            JUSTTCG_API_KEY=${{ secrets.JUSTTCG_API_KEY }}
            GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
            NEXT_PUBLIC_GOOGLE_PLACES_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            SMTP_FROM=no-reply@mail.packattack.gg
            AUTH_TRUST_HOST=true
            ENVEOF

            printf 'BUILD_SHA=%s\nBUILD_BRANCH=%s\n' "$BUILD_SHA" "$BUILD_BRANCH" >> .env.beta

            # Remove leading whitespace from heredoc
            sed -i 's/^            //' .env.beta

            # Rebuild and restart containers (--env-file loads vars for build args)
            docker compose --env-file .env.beta -f docker-compose.beta.yml up --build -d

            # Cleanup old images
            docker image prune -f
